name: Temporary Actions artifact cleanup

on:
  push:
    paths:
      - .github/workflows/actions-artifact-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ARTIFACTS: "3"
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | [.created_at, (.id|tostring), (.size_in_bytes|tostring), .name] | @tsv' |
              sort -r
          )

          total=${#artifacts[@]}
          deleted=0
          freed=0

          if (( total > KEEP_ARTIFACTS )); then
            for ((i=KEEP_ARTIFACTS; i<total; i++)); do
              IFS=$'\t' read -r created artifact_id size name <<< "${artifacts[$i]}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              deleted=$((deleted + 1))
              freed=$((freed + size))
              printf 'Deleted: %s (%s bytes, %s)\n' "$name" "$size" "$created"
            done
          fi

          {
            echo "### Artifact cleanup"
            echo "- Kept newest: ${KEEP_ARTIFACTS}"
            echo "- Found active: ${total}"
            echo "- Deleted: ${deleted}"
            echo "- Freed bytes: ${freed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/actions-artifact-cleanup.yml
          git commit -m "chore: remove temporary artifact cleanup workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
