name: Build APK

on:
  push:
    branches: [redesign, redesign-v2, main, feature/verified-key-hub-sources, feature/singbox-multiengine, feature/singbox-full-vpn]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Ветка redesign-v2 публикует логи и сборку отдельно, чтобы не затирать результаты redesign.
      LOGS_BRANCH: ${{ github.ref_name == 'feature/singbox-full-vpn' && 'ci-logs-singbox-vpn' || github.ref_name == 'feature/singbox-multiengine' && 'ci-logs-singbox' || github.ref_name == 'redesign-v2' && 'ci-logs-v2' || github.ref_name == 'feature/verified-key-hub-sources' && 'ci-logs-verified-keys' || 'ci-logs' }}
      RELEASE_TAG: ${{ github.ref_name == 'feature/singbox-full-vpn' && 'beta-singbox-vpn' || github.ref_name == 'feature/singbox-multiengine' && 'beta-singbox' || github.ref_name == 'redesign-v2' && 'beta-v2' || github.ref_name == 'feature/verified-key-hub-sources' && 'beta-verified-keys' || 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore original signing key (optional)
        env:
          P12_B64: ${{ secrets.SITESCOPE_SIGNING_P12_BASE64 }}
        run: |
          if [ -n "$P12_B64" ]; then
            echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SITESCOPE_SIGNING_P12=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Bundle pinned sing-box 1.14.4 Android ARM64 core
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sing-box-android-arm64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-android-arm64.tar.gz" \
            -o "$archive"
          echo "fb3a6c5197f4044f82c8fd75e01ce14c28b6abdd4c3df84bb987d41a962a320f  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/singbox-unpack"
          tar -xzf "$archive" -C "$RUNNER_TEMP/singbox-unpack"
          executable="$(find "$RUNNER_TEMP/singbox-unpack" -type f -name sing-box -print -quit)"
          test -n "$executable"
          install -m 755 "$executable" app/src/main/jniLibs/arm64-v8a/libsingbox_exec.so
          file app/src/main/jniLibs/arm64-v8a/libsingbox_exec.so
          echo "Bundled native sing-box CLI; official release SHA256 verified"

      - name: Test and build
        env:
          SITESCOPE_KEYSTORE_PASSWORD: ${{ secrets.SITESCOPE_KEYSTORE_PASSWORD }}
          SITESCOPE_KEY_ALIAS: ${{ secrets.SITESCOPE_KEY_ALIAS }}
          SITESCOPE_KEY_PASSWORD: ${{ secrets.SITESCOPE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease 2>&1 | tee build.log

      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SiteScopePro-checks
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
          if-no-files-found: warn

      - name: Verify APK (apksigner, aapt2, zipalign)
        if: always()
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          {
            echo "apk=$apk build-tools=$bt"
            if [ -n "$apk" ] && [ -n "$bt" ]; then
              echo "--- apksigner verify"; "$bt/apksigner" verify --verbose --print-certs "$apk" 2>&1 | head -n 30
              echo "--- zipalign"; "$bt/zipalign" -c -P 16 -v 4 "$apk" 2>&1 | tail -n 5
              echo "--- aapt2 badging"; "$bt/aapt2" dump badging "$apk" 2>&1 | grep -E "^package|sdkVersion|targetSdk|native-code|uses-permission" | head -n 40
            fi
          } > "$GITHUB_WORKSPACE/apk-check.txt" 2>&1 || true

      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          cp "$GITHUB_WORKSPACE/build.log" build.log 2>/dev/null || echo "no log" > build.log
          grep -nE "^e: |^w: .*error|error:|FAILED|What went wrong|Unresolved|Exception" -A4 build.log | head -n 600 > errors.log || true
          tail -n 250 build.log > tail.log
          cp "$GITHUB_WORKSPACE/apk-check.txt" apk-check.txt 2>/dev/null || true
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          rm -f build.log
          git init -q && git checkout -q -b "$LOGS_BRANCH"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "CI log for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$LOGS_BRANCH"

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$apk" "dist/SiteScopePro-$version.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with: { name: SiteScopePro-apk, path: dist/ }

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "SiteScope Pro — свежая сборка" \
            --notes "Автоматическая сборка из ветки ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Один APK, без дополнительных файлов: все библиотеки (arm64-v8a) и данные внутри. Подпись v1+v2+v3 (CN=SiteScope Pro Beta). SHA-256: $(cut -d' ' -f1 dist/SHA256SUMS.txt)"
